name: Signaler un bug · Report a bug
description: Quelque chose ne fonctionne pas comme prévu. · Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. · Thank you for taking the time to report this problem.
        **Une faille de sécurité ne se signale pas ici** : voir SECURITY.md. · **Do not report a security vulnerability here**: see SECURITY.en.md.
        N'incluez aucune donnée réelle (noms, emails de clients…). · Do not include any real data (customer names, e-mails…).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il, et qu'attendiez-vous ? · What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire · Steps to reproduce
      placeholder: |
        1. Aller sur… · Go to…
        2. Cliquer sur… · Click on…
        3. Constater… · See…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit · Version or commit
      placeholder: "v1.1.0 ou abc1234"
  - type: dropdown
    id: environment
    attributes:
      label: Environnement · Environment
      options:
        - Docker (développement · development)
        - Docker (production)
        - Installation locale sans Docker · Local install without Docker
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux ou captures · Logs or screenshots
      description: Messages d'erreur de la console du navigateur ou de `docker compose logs`. · Error messages from the browser console or from `docker compose logs`.
      render: shell

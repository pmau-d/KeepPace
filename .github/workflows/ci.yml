name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : la CI n'a besoin d'aucun secret ni d'aucun droit d'écriture.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: keeppace
          POSTGRES_PASSWORD: keeppace
          POSTGRES_DB: keeppace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keeppace" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Toute la suite tourne sur un vrai PostgreSQL (SQLite en mémoire en local).
      TEST_DATABASE_URL: postgresql+psycopg://keeppace:keeppace@localhost:5432/keeppace_test
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://keeppace:keeppace@localhost:5432/keeppace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Images Docker de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image du backend
        run: docker build --target prod -t keeppace-backend:ci backend
      - name: Construire l'image du frontend
        run: docker build --target prod -t keeppace-frontend:ci frontend
      - name: Valider les fichiers Compose
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q


services:
  db:
    image: postgres:15-alpine
    container_name: keeppace_db
    restart: always
    environment:
      POSTGRES_USER: keeppace_user
      POSTGRES_PASSWORD: keeppace_password
      POSTGRES_DB: keeppace_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - keeppace_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keeppace_backend
    restart: always
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://keeppace_user:keeppace_password@db:5432/keeppace_dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keeppace_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keeppace_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    networks:
      - keeppace_network

networks:
  keeppace_network:
    driver: bridge

volumes:
  postgres_data:

